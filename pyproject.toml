[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cellrob"
version = "0.1.0"
description = "Single-cell contact boundary detection and cross-cell alignment"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy"]

[project.scripts]
cellrob = "cellrob.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
